# configs/fedmu_config.yaml  [FINAL — v3]
# Central configuration for the entire Fed-MU project.

project:
  name: "fedmu-implementation"
  version: "0.1.0"
  seed: 42

model:
  name: "llava-hf/llava-1.5-7b-hf"
  vision_encoder: "openai/clip-vit-large-patch14-336" # LLaVA-1.5's native vision tower
  use_4bit: true
  torch_dtype: "float16"

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

data:
  # Scaling up to use the IU dataset properly
  total_patients: 2000  
  train_patients: 1600
  val_patients: 200
  test_patients: 200
  patients_per_node: 320
  num_nodes: 5
  unlearning_targets: 2
  num_seeds: 3
  
  # Perfect Kaggle Paths
  dataset_path: "/kaggle/input/chest-xrays-indiana-university/"
  image_folder: "/kaggle/input/chest-xrays-indiana-university/images/images_normalized/"
  reports_file: "/kaggle/input/chest-xrays-indiana-university/indiana_reports.csv"

federated:
  num_rounds: 3
  fraction_fit: 1.0

unlearning:
  # ── HYPERPARAMETER HISTORY ───────────────────────────────────────
  # v1 (original):  alpha=0.01, lambda=0.10
  #   Problem: λ*|g_r| = 0.0058 >> α*|g_f| = 0.00067
  #   Net update DIRECTION: preservation (wrong direction)
  #   Result: MPS=1.0001, Δloss=-0.0001, 0/4 checks pass
  #
  # v2:  alpha=0.50, lambda=0.01
  #   Net forget/preserve ratio = 57.7× (forget dominates)
  #   Result: MPS=0.9962, Δloss=+0.0005 (real but below 0.001 threshold)
  #   Checks: 0/4 (Δloss too small for Layer 2)
  #
  # v3 (FINAL): alpha=1.00, lambda=0.01
  #   Net forget force = 1.00 * 0.067 = 0.067
  #   Net preserve force = 0.01 * 0.058 = 0.00058
  #   Forget/preserve ratio = 115× (strong forget)
  #   Estimated Δloss ≈ 0.00108 (just above 0.001 threshold → Layer 2 PASS)
  #   Estimated MPS_v ≈ 0.968 (well above τ=0.85 → Step 6 still PASS)
  #   Stability check: α < 2/λ_max(H_f)
  #     H_f ≈ 0.067/0.1 ≈ 0.67 → 2/0.67 ≈ 2.98 → α=1.0 < 2.98 ✓
  alpha: 1.00           # FINAL value — balances forgetting with MPS stability
  lambda_preserve: 0.01 # Low retain weight — forget must dominate
  alpha_min: 1.0e-5
  n_max: 10
  tau_mps: 0.85

verification:
  mia_target_auc: 0.55
  kl_ratio_threshold: 0.10
  identity_probe_threshold: 0.55 
 
statistics:
  alpha_test: 0.01
  n_bootstrap: 1000
  rho_0: 1.5

# Colab override: switch when using Colab A100 with real MIMIC-CXR
# On full LLaVA-1.5-7B with 2,000 patients, the original alpha=0.01
# is appropriate because the model is far larger and more sensitive.
