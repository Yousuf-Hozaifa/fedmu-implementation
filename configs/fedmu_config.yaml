# configs/fedmu_config.yaml
# Central configuration for the entire Fed-MU project
# Change values here — never hardcode them in Python files

project:
  name: "fedmu-implementation"
  version: "0.1.0"
  seed: 42

# For 8GB RAM / CPU: we use tiny models and small data subsets
model:
  name: "microsoft/phi-1_5"      # Tiny 1.3B LLM — fits in 8GB RAM
  vision_encoder: "openai/clip-vit-base-patch32"  # Smallest CLIP variant
  use_4bit: false                 # 4-bit requires GPU; set to false for CPU
  torch_dtype: "float32"

lora:
  rank: 4                        # Very small rank for CPU experiments
  alpha: 8
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

data:
  # Tiny subset for CPU experiments
  total_patients: 50             # We will simulate patients with toy data
  train_patients: 40
  val_patients: 5
  test_patients: 5
  patients_per_node: 8
  num_nodes: 5
  unlearning_targets: 2          # 2 target patients per experiment
  num_seeds: 3

federated:
  num_rounds: 2
  fraction_fit: 1.0

unlearning:
  alpha: 0.01
  lambda_preserve: 0.10
  alpha_min: 1.0e-5
  n_max: 10                      # Fewer iterations for CPU
  tau_mps: 0.85                  # Slightly relaxed for toy experiments

verification:
  mia_target_auc: 0.55
  kl_ratio_threshold: 0.10
  identity_probe_threshold: 0.55

statistics:
  alpha_test: 0.01
  n_bootstrap: 1000              # Reduced for speed on CPU
  rho_0: 1.5

# Colab override: switch these when using Colab A100
colab_overrides:
  model_name: "llava-hf/llava-1.5-7b-hf"
  use_4bit: true
  torch_dtype: "float16"
  total_patients: 2000
  lora_rank: 16
  n_bootstrap: 10000